<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&family=Dancing+Script:wght@600;700&family=Short+Stack&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LOVE SURPRISE — single-file interactive experience
   Screens: meter → gifts → bouquet → music → letter
   All artwork is original inline SVG/CSS.
   ============================================================ */
:root{
  --bg:#ffe1e9;
  --bg2:#ffd6e2;
  --ink:#c2154a;
  --ink-deep:#8f1d3d;
  --ink-soft:#d95c82;
  --card:#fff7f9;
  --g1:#f6c9d4; --g2:#ef9db4; --g3:#e26a8d; --g4:#b83a5c;
  --btn:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Quicksand',sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
}
#stage{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}

/* ---------- floating hearts backdrop ---------- */
.float-heart{
  position:absolute;bottom:-30px;font-size:16px;opacity:0;
  animation:floatUp linear forwards;pointer-events:none;z-index:1;
}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  12%{opacity:.55}
  100%{transform:translateY(-110vh) rotate(28deg);opacity:0}
}

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:22px;
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .55s ease,transform .55s ease,visibility .55s;
  z-index:2;
}
.screen.active{opacity:1;visibility:visible;transform:translateY(0)}

/* ---------- shared UI ---------- */
.pill-btn{
  font-family:'Quicksand',sans-serif;font-weight:700;font-size:15px;
  color:var(--ink);background:var(--btn);
  border:2px solid #f3bccb;border-radius:999px;
  padding:9px 26px;cursor:pointer;box-shadow:0 3px 10px rgba(194,21,74,.14);
  transition:transform .15s ease,box-shadow .15s ease;
}
.pill-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(194,21,74,.2)}
.pill-btn:active{transform:translateY(0)}
.corner-next{position:absolute;top:20px;right:20px;z-index:6}
h1.big{
  font-family:'Baloo 2',cursive;font-weight:800;
  color:var(--ink);letter-spacing:.5px;text-align:center;
}

/* ============================================================
   SCREEN 1 — LOVE METER
   ============================================================ */
#screen-meter{gap:6px}
.cat-stage{position:relative;width:170px;height:150px}
.cat-stage svg{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;transform:scale(.85);transition:opacity .3s,transform .3s;
}
.cat-stage svg.show{opacity:1;transform:scale(1)}
#reaction{
  font-family:'Baloo 2',cursive;font-weight:700;font-size:clamp(20px,5vw,27px);
  color:#a41641;text-align:center;min-height:34px;
}
#percent{
  font-family:'Baloo 2',cursive;font-weight:800;
  font-size:clamp(30px,7vw,40px);color:var(--ink);
  transition:opacity .4s,transform .4s;min-height:48px;
}
#percent.hide{opacity:0;transform:scale(.6);min-height:0;height:0}
#meterNext{opacity:0;transform:translateY(8px);pointer-events:none;transition:.4s;margin-bottom:6px}
#meterNext.show{opacity:1;transform:none;pointer-events:auto}

.gauge-wrap{position:relative;width:min(320px,84vw)}
.gauge-wrap svg{width:100%;height:auto;display:block}
#needleGroup{transform-origin:150px 148px;transform:rotate(-90deg);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
#needleGroup.win{animation:winSwing .9s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes winSwing{0%{transform:rotate(90deg)}55%{transform:rotate(104deg)}80%{transform:rotate(96deg)}100%{transform:rotate(100deg)}}

#loveRange{
  -webkit-appearance:none;appearance:none;width:min(300px,80vw);
  height:4px;border-radius:99px;background:#f3b9c8;outline:none;margin-top:2px;cursor:pointer;
}
#loveRange::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
  background:#d81b4f;border:3px solid #fff;box-shadow:0 2px 6px rgba(160,20,60,.4);cursor:grab;
}
#loveRange::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:#d81b4f;
  border:3px solid #fff;box-shadow:0 2px 6px rgba(160,20,60,.4);cursor:grab;
}

/* decorations on meter screen */
.deco-lovebirds{position:absolute;top:22px;right:22px;width:110px;opacity:.95}
.deco-plane{position:absolute;left:4vw;top:52%;width:150px;opacity:.9;pointer-events:none}
@media(max-width:640px){
  .deco-plane{width:100px;top:auto;bottom:8px;left:2vw}
  .deco-lovebirds{width:80px;top:14px;right:14px}
}

/* burst hearts on win */
.burst{position:absolute;font-size:15px;pointer-events:none;animation:burstFly .9s ease-out forwards;z-index:8}
@keyframes burstFly{
  from{transform:translate(0,0) scale(.6);opacity:1}
  to{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0}
}

/* ============================================================
   SCREEN 2 — YOU PASSED / GIFTS
   ============================================================ */
#screen-passed{background:linear-gradient(160deg,#ffe4ec,#ffd3e0)}
#screen-passed h1{font-size:clamp(28px,6.5vw,44px)}
#screen-passed .sub{font-weight:600;color:#c94f74;margin-top:6px;font-size:clamp(14px,3.6vw,18px)}
.gift-row{display:flex;gap:clamp(24px,8vw,80px);margin-top:42px;flex-wrap:wrap;justify-content:center}
.gift{width:clamp(120px,26vw,170px);cursor:pointer;transition:transform .2s;position:relative}
.gift:hover{transform:translateY(-6px) scale(1.04)}
.gift.bounce{animation:giftBounce 2.2s ease-in-out infinite}
.gift:nth-child(2).bounce{animation-delay:.4s}
@keyframes giftBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gift.opening{animation:giftShake .5s ease-in-out}
@keyframes giftShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.gift .lid{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.gift.open .lid{transform:translateY(-46px) rotate(-14deg)}

/* ============================================================
   SCREEN 3 — BOUQUET
   ============================================================ */
#screen-bouquet{
  background:
    radial-gradient(circle at 12% 12%,rgba(255,255,255,.5),transparent 32%),
    radial-gradient(circle at 88% 88%,rgba(255,182,203,.5),transparent 34%),
    linear-gradient(160deg,#ffdce6,#ffcfdd);
  justify-content:flex-start;padding-top:20px;
}
#screen-bouquet h1{font-size:clamp(26px,6vw,40px);margin-top:2px}
.bouquet-layout{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:8px;width:min(980px,100%);margin-top:8px;flex:1;
}
.bouquet-card{
  background:#fff8f9;border:3px dashed #f0a7bc;border-radius:28px;
  padding:clamp(8px,2vw,20px);box-shadow:0 10px 26px rgba(180,40,80,.14);
  position:relative;
}
.bouquet-card::before{
  content:"";position:absolute;inset:6px;border:2px solid #f7cdd9;border-radius:22px;pointer-events:none;
}
.bouquet-card svg{width:clamp(180px,32vw,250px);height:auto;display:block}
.note-col{display:flex;flex-direction:column;gap:clamp(12px,3vh,30px);align-items:center}
.note{
  background:#fffdfd;border:1.5px solid #edb9c8;border-radius:16px;
  padding:10px 14px;max-width:210px;text-align:center;position:relative;
  font-family:'Dancing Script',cursive;font-weight:700;
  font-size:clamp(15px,2.6vw,19px);color:#8f2c49;
  box-shadow:0 4px 10px rgba(180,40,80,.10);
  opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;
}
.note.in{opacity:1;transform:none}
.note::after{
  content:"";position:absolute;bottom:-7px;left:26px;width:12px;height:12px;
  background:inherit;border-right:1.5px solid #edb9c8;border-bottom:1.5px solid #edb9c8;
  transform:rotate(45deg);
}
.note-col.right .note::after{left:auto;right:26px}
@media(max-width:760px){
  .bouquet-layout{grid-template-columns:1fr 1fr;grid-template-areas:"card card" "left right"}
  .bouquet-card{grid-area:card;justify-self:center}
  .note-col.left{grid-area:left}.note-col.right{grid-area:right}
  .note{max-width:100%;font-size:14px;padding:8px 10px}
}
.corner-lace{position:absolute;width:130px;opacity:.85;pointer-events:none;z-index:1}
.corner-lace.tl{top:-6px;left:-6px}
.corner-lace.br{bottom:-6px;right:-6px;transform:rotate(180deg)}

/* ============================================================
   SCREEN 4 — MUSIC / SCRAPBOOK
   ============================================================ */
#screen-music{
  background:
    radial-gradient(circle at 80% 20%,rgba(255,255,255,.55),transparent 30%),
    radial-gradient(circle at 15% 80%,rgba(244,143,177,.35),transparent 35%),
    linear-gradient(150deg,#ffd9e3,#f9c7d6 60%,#f5bccd);
}
.scrap-stage{position:relative;width:min(760px,100%);height:min(78vh,540px)}
.polaroid{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-1.5deg);
  background:#fff;padding:12px 12px 44px;border-radius:4px;
  box-shadow:0 14px 30px rgba(140,30,70,.22);
  width:clamp(230px,46vw,330px);z-index:3;
}
.polaroid svg{width:100%;height:auto;display:block;border-radius:2px}
.ticket{
  position:absolute;font-family:'Quicksand',sans-serif;font-weight:700;
  border:1.5px dashed #a8875f;color:#6d4c2a;background:#e9d3ac;
  padding:7px 12px;border-radius:6px;font-size:11px;line-height:1.25;
  box-shadow:0 4px 9px rgba(120,80,30,.25);text-transform:uppercase;letter-spacing:.6px;z-index:4;
}
.ticket small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.4px;color:#8a6a3f}
.t1{top:4%;left:4%;transform:rotate(-8deg);background:#ecd7b2}
.t2{top:15%;left:2%;transform:rotate(-3deg);background:#e3c79b}
.t3{top:26%;left:5%;transform:rotate(-10deg);background:#efdcc0}
.blossoms-bl{position:absolute;bottom:-2%;left:-2%;width:clamp(150px,30vw,230px);z-index:5;pointer-events:none}
.butterfly-tr{position:absolute;top:4%;right:12%;width:70px;z-index:4;animation:flutter 4s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(-9px) rotate(-4deg)}}
.doily-r{position:absolute;top:32%;right:-4%;width:170px;opacity:.9;z-index:2}
.player{
  position:absolute;left:50%;bottom:2%;transform:translateX(-38%);
  background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
  border-radius:16px;box-shadow:0 10px 26px rgba(150,30,70,.25);
  padding:12px 16px;width:clamp(250px,52vw,320px);z-index:6;
}
.player .row1{display:flex;gap:10px;align-items:center}
.player .thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.player .thumb svg{width:100%;height:100%;display:block}
.player .meta{min-width:0}
.player .title{font-weight:700;font-size:14px;color:#5a2337;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .artist{font-size:12px;color:#b06a84;font-weight:600}
.progress{height:4px;background:#f2cdd9;border-radius:99px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#e26a8d,#c2154a);border-radius:99px;transition:width .25s linear}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:9px}
.controls button{background:none;border:none;cursor:pointer;padding:4px;color:#c2154a;display:flex}
.controls svg{width:19px;height:19px;fill:#c2154a}
.controls .play{width:38px;height:38px;border-radius:50%;background:#c2154a;justify-content:center;align-items:center;box-shadow:0 4px 10px rgba(194,21,74,.4)}
.controls .play svg{fill:#fff;width:17px;height:17px}
@media(max-width:640px){
  .doily-r{display:none}
  .butterfly-tr{right:4%}
  .player{transform:translateX(-50%);}
}

/* ============================================================
   SCREEN 5 — LETTER
   ============================================================ */
#screen-letter{
  background:linear-gradient(155deg,#ffe9ef,#ffdbe5);
  justify-content:flex-start;align-items:flex-start;padding:26px 30px;
}
#screen-letter h1{
  font-size:clamp(26px,6vw,42px);text-align:left;color:#e8547c;
  text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff,3px 4px 6px rgba(190,50,90,.25);
}
.letter-paper{
  position:relative;margin:14px auto 0;width:min(680px,100%);
  flex:1;min-height:0;overflow:auto;
  background:
    repeating-linear-gradient(#fffdfd,#fffdfd 30px,#f6cdd8 31px);
  border-radius:10px;padding:20px 26px 60px;box-shadow:0 8px 24px rgba(180,40,80,.12);
}
.letter-text{
  font-family:'Short Stack',cursive;font-size:clamp(14.5px,2.8vw,17px);
  line-height:31px;color:#7a2733;white-space:pre-wrap;
}
.caret{display:inline-block;width:2px;height:1.05em;background:#c2154a;vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.signoff{
  font-family:'Dancing Script',cursive;font-weight:700;text-align:right;
  font-size:clamp(20px,4vw,26px);color:#c2154a;margin-top:14px;
  opacity:0;transition:opacity .8s;
}
.signoff.in{opacity:1}
.blossom-r{position:absolute;top:12%;right:1.5%;width:clamp(60px,9vw,95px);z-index:1;pointer-events:none}
.cat-heart{position:absolute;bottom:1%;left:1%;width:clamp(120px,20vw,175px);z-index:4;pointer-events:none}
#letterBtn{position:absolute;bottom:22px;right:26px;z-index:5}
@media(max-width:640px){#screen-letter{padding:20px 16px}.blossom-r{display:none}}
</style>
</head>
<body>
<div id="stage">

  <!-- ================= SCREEN 1 : LOVE METER ================= -->
  <section class="screen active" id="screen-meter">

    <!-- lovebirds (original) -->
    <svg class="deco-lovebirds" viewBox="0 0 140 80">
      <path d="M66 12c0-5 4-8 8-8s7 3 7 7c0-4 3-7 7-7s8 3 8 8c0 8-15 16-15 16S66 20 66 12z" fill="#f06292"/>
      <g><ellipse cx="38" cy="52" rx="22" ry="19" fill="#fff" stroke="#e8b7c6" stroke-width="1.5"/>
      <circle cx="44" cy="47" r="2.4" fill="#5a3a44"/><circle cx="31" cy="47" r="2.4" fill="#5a3a44"/>
      <ellipse cx="27" cy="54" rx="3.4" ry="2.2" fill="#f8a8c0"/><ellipse cx="48" cy="54" rx="3.4" ry="2.2" fill="#f8a8c0"/>
      <path d="M36 51l3 2.6 3-2.6" fill="none" stroke="#e8944f" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 52c-5 1-7 6-5 9 3-1 7-4 5-9z" fill="#fceff3" stroke="#e8b7c6"/></g>
      <g><ellipse cx="100" cy="52" rx="22" ry="19" fill="#fff" stroke="#e8b7c6" stroke-width="1.5"/>
      <circle cx="94" cy="47" r="2.4" fill="#5a3a44"/><circle cx="107" cy="47" r="2.4" fill="#5a3a44"/>
      <ellipse cx="90" cy="54" rx="3.4" ry="2.2" fill="#f8a8c0"/><ellipse cx="111" cy="54" rx="3.4" ry="2.2" fill="#f8a8c0"/>
      <path d="M98 51l3 2.6 3-2.6" fill="none" stroke="#e8944f" stroke-width="2" stroke-linecap="round"/>
      <path d="M121 52c5 1 7 6 5 9-3-1-7-4-5-9z" fill="#fceff3" stroke="#e8b7c6"/></g>
    </svg>

    <!-- paper plane + dashed heart trail (original) -->
    <svg class="deco-plane" viewBox="0 0 190 150">
      <path d="M60 118c-22 4-40-6-42-22-2-14 10-22 22-18 1-12 16-18 26-9 12-14 36-8 38 8 2 14-12 26-22 32" fill="none" stroke="#e598ad" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/>
      <g transform="translate(18,10) rotate(-18)">
        <path d="M0 22 60 0 34 40z" fill="#f7b3c6"/>
        <path d="M0 22 60 0 24 26z" fill="#fbd0dc"/>
        <path d="M24 26 60 0 34 40 30 30z" fill="#ef93ae"/>
        <circle cx="18" cy="17" r="2.2" fill="#7a2733"/><circle cx="27" cy="14" r="2.2" fill="#7a2733"/>
      </g>
    </svg>

    <!-- cat reactions (original mochi-style blob cats) -->
    <div class="cat-stage" id="catStage">
      <!-- neutral / question -->
      <svg id="cat-idle" class="show" viewBox="0 0 120 110">
        <path d="M33 26Q25 4 45 8Q54 11 47 25Z M87 26Q95 4 75 8Q66 11 73 25Z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M37 21Q34 10 43 12Q47 14 44 21Z M83 21Q86 10 77 12Q73 14 76 21Z" fill="#f9c6cf"/>
        <path d="M60 12c30 0 44 20 44 46 0 28-18 44-44 44S16 86 16 58c0-26 14-46 44-46z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5"/>
        <circle cx="45" cy="52" r="4.4" fill="#4a3f3a"/><circle cx="75" cy="52" r="4.4" fill="#4a3f3a"/>
        <path d="M56 60c1.6 2.4 6.4 2.4 8 0" fill="none" stroke="#4a3f3a" stroke-width="2.4" stroke-linecap="round"/>
        <ellipse cx="36" cy="62" rx="5" ry="3" fill="#f9c6cf"/><ellipse cx="84" cy="62" rx="5" ry="3" fill="#f9c6cf"/>
      </svg>
      <!-- crying -->
      <svg id="cat-cry" viewBox="0 0 120 110">
        <path d="M32 28Q20 8 42 9Q52 12 46 26Z M88 28Q100 8 78 9Q68 12 74 26Z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M60 12c30 0 44 20 44 46 0 28-18 44-44 44S16 86 16 58c0-26 14-46 44-46z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5"/>
        <path d="M39 50c3-3 8-3 11 0M70 50c3-3 8-3 11 0" fill="none" stroke="#4a3f3a" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M55 63c2-2.6 8-2.6 10 0" fill="none" stroke="#4a3f3a" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M42 56c-3 8-4 18-1 26 2 6 8 6 10 0 3-8 2-18-1-26" fill="#9bd4f5" stroke="#5fb0dd" stroke-width="1.6"/>
        <path d="M72 56c-3 8-4 18-1 26 2 6 8 6 10 0 3-8 2-18-1-26" fill="#9bd4f5" stroke="#5fb0dd" stroke-width="1.6"/>
      </svg>
      <!-- unimpressed -->
      <svg id="cat-meh" viewBox="0 0 120 110">
        <path d="M36 22Q29 2 47 6Q55 9 49 21Z M84 22Q91 2 73 6Q65 9 71 21Z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M60 10c26 0 38 16 38 42v18c0 22-14 36-38 36S22 92 22 70V52c0-26 12-42 38-42z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5"/>
        <circle cx="47" cy="48" r="4" fill="#4a3f3a"/><circle cx="73" cy="48" r="4" fill="#4a3f3a"/>
        <path d="M54 60h12" stroke="#4a3f3a" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M34 78c-6 2-8 8-5 12M86 78c6 2 8 8 5 12" fill="none" stroke="#4a3f3a" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <!-- clapping / happy -->
      <svg id="cat-yay" viewBox="0 0 120 110">
        <g fill="#e05d7d"><circle cx="14" cy="40" r="3.4"/><circle cx="24" cy="58" r="2.6"/><circle cx="10" cy="72" r="2.6"/><circle cx="106" cy="40" r="3.4"/><circle cx="96" cy="58" r="2.6"/><circle cx="110" cy="72" r="2.6"/></g>
        <g fill="#f2a7bd"><circle cx="22" cy="28" r="2.4"/><circle cx="98" cy="28" r="2.4"/></g>
        <g transform="rotate(-6 60 60)">
          <path d="M34 22Q26 0 46 5Q55 8 48 21Z M86 22Q94 0 74 5Q65 8 72 21Z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M60 10c28 0 40 18 40 44 0 26-16 42-40 42S20 80 20 54c0-26 12-44 40-44z" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5"/>
          <path d="M24 48c-9-2-14 4-12 11 2 6 10 7 14 2M96 48c9-2 14 4 12 11-2 6-10 7-14 2" fill="#fdf3ec" stroke="#4a3f3a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M40 46c2.6-3 7-3 10 0M70 46c2.6-3 7-3 10 0" fill="none" stroke="#4a3f3a" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M50 56c0 8 20 8 20 0 0-3-4-4-10-4s-10 1-10 4z" fill="#69332c"/>
          <path d="M54 61c2 2.4 10 2.4 12 0v-2H54z" fill="#f08a9d"/>
        </g>
      </svg>
    </div>

      <g fill="#d95c82"><path d="M32 26c-5-7-14-5-15 1-1 6 8 10 13 6 5 4 14 0 13-6-1-6-10-8-11-1z" opacity=".9" transform="scale(.6) translate(10,4)"/><path d="M180 40c-4-6-12-4-13 1-1 5 7 9 11 5 4 4 12 0 11-5-1-5-9-7-9-1z" transform="scale(.7) translate(60,10)"/></g>
      <!-- tail -->
      <path d="M162 122c22-4 30-22 20-34" fill="none" stroke="#4a3f3a" stroke-width="3" stroke-linecap="round"/>
      <path d="M162 120c20-4 27-20 19-30" fill="none" stroke="#e8944f" stroke-width="9" stroke-linecap="round"/>
      <!-- head -->
      <path d="M100 30c34 0 52 20 52 48 0 30-20 48-52 48S48 108 48 78c0-28 18-48 52-48z" fill="#fdf6ef" stroke="#4a3f3a" stroke-width="3"/>
      <path d="M64 42 54 22l22 10zM136 42l10-20-22 10z" fill="#fdf6ef" stroke="#4a3f3a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M60 40 54 24l16 8c-6 2-9 5-10 8z" fill="#e8944f"/>
      <path d="M100 30c14 0 26 4 34 10-8 14-26 18-40 10-8-6-6-16 6-20z" fill="#e8944f" opacity=".9"/>
      <path d="M140 42l6-16-14 7c4 2 7 5 8 9z" fill="#8a8078"/>
      <!-- happy closed eyes + blush -->
      <path d="M70 72c3-4 9-4 12 0M118 72c3-4 9-4 12 0" fill="none" stroke="#4a3f3a" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="66" cy="84" rx="6" ry="3.6" fill="#f6a9bb"/><ellipse cx="134" cy="84" rx="6" ry="3.6" fill="#f6a9bb"/>
      <path d="M95 82c2 3 8 3 10 0" fill="none" stroke="#4a3f3a" stroke-width="2.6" stroke-linecap="round"/>
      <!-- heart -->
      <path d="M100 106c-12-16-36-12-38 4-2 16 20 30 38 40 18-10 40-24 38-40-2-16-26-20-38-4z" fill="#e03a54" stroke="#a01432" stroke-width="3"/>
      <path d="M78 112c3-5 9-7 14-5" fill="none" stroke="#f28aa0" stroke-width="4" stroke-linecap="round"/>
      <!-- paws over heart -->
      <ellipse cx="76" cy="110" rx="12" ry="9" fill="#fdf6ef" stroke="#4a3f3a" stroke-width="3"/>
      <ellipse cx="124" cy="110" rx="12" ry="9" fill="#fdf6ef" stroke="#4a3f3a" stroke-width="3"/>
      <path d="M72 108v5M80 107v6M120 107v6M128 108v5" stroke="#4a3f3a" stroke-width="1.6"/>
    </svg>

    <button class="pill-btn" id="letterBtn">Next&nbsp;&rarr;</button>
  </section>

</div>

<script>
/* ============================================================
   CONFIG — edit everything here 💗
   ============================================================ */
const CONFIG = {
  question: "How much do you love me?",
  reactions: {
    low:  "Only that much?",          // 1–39
    mid:  "Half? Seriously?",         // 40–69
    high: "Aww, that's more like it!",// 70–99
    win:  "Correct answer!"           // 100 → shows 1000%
  },
  bouquetTitle: "Your Bouquet",
  bouquetNotes: [
    "You make my heart bloom",
    "Life is sweeter with you",
    "Every petal, a reason I love you",
    "I choose you, today and always",
    "My love for you keeps growing",
    "My heart will always find you"
  ],
  song: { title: "Birds of a Feather", artist: "Billie Eilish", fallbackDuration: 210 },
  letterTitle: "A Letter From My Heart",
  letterParagraphs: [
    "From the moment you came into my life, everything has felt a little brighter. I feel so lucky to wake up each day knowing I get to love you, and I would choose you again in every lifetime.",
    "You make me laugh, you make me feel safe, and you fill my days with a kind of happiness I never knew before. Even the most ordinary day feels like something worth celebrating when it's spent with you.",
    "Thank you for being exactly who you are, and for loving me the way you do. Whatever comes our way, my answer will always be the same — it has always been you."
  ],
  signOff: "Always, forever. ❤"
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
function goTo(id){
  $$('.screen').forEach(sc=>sc.classList.remove('active'));
  $('#'+id).classList.add('active');
  if(id==='screen-bouquet') revealNotes();
  if(id==='screen-letter') startLetter();
}
$$('[data-next]').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.next)));

/* ---------- floating hearts ---------- */
const HEARTS=['❤','💗','💕','🌸','💖'];
setInterval(()=>{
  const h=document.createElement('span');
  h.className='float-heart';
  h.textContent=HEARTS[Math.floor(Math.random()*HEARTS.length)];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(11+Math.random()*14)+'px';
  h.style.animationDuration=(7+Math.random()*7)+'s';
  $('#stage').appendChild(h);
  setTimeout(()=>h.remove(),15000);
},900);

/* ============================================================
   SCREEN 1 — meter logic
   ============================================================ */
const range=$('#loveRange'), needle=$('#needleGroup'),
      reaction=$('#reaction'), percent=$('#percent'),
      meterNext=$('#meterNext');
const cats={idle:$('#cat-idle'),cry:$('#cat-cry'),meh:$('#cat-meh'),yay:$('#cat-yay')};
let won=false;

function showCat(key){
  Object.values(cats).forEach(c=>c.classList.remove('show'));
  cats[key].classList.add('show');
}
function paintTrack(v){
  range.style.background=`linear-gradient(90deg,#d81b4f ${v}%,#f3b9c8 ${v}%)`;
}
function burst(){
  const stage=$('#catStage'), r=stage.getBoundingClientRect(), host=$('#screen-meter');
  for(let i=0;i<18;i++){
    const b=document.createElement('span');
    b.className='burst';
    b.textContent=Math.random()<.7?'❤':'✿';
    b.style.color=Math.random()<.5?'#e03a54':'#f2a7bd';
    b.style.left=(r.left+r.width/2-host.getBoundingClientRect().left)+'px';
    b.style.top=(r.top+r.height/2-host.getBoundingClientRect().top)+'px';
    const a=Math.random()*Math.PI*2, d=60+Math.random()*80;
    b.style.setProperty('--dx',Math.cos(a)*d+'px');
    b.style.setProperty('--dy',Math.sin(a)*d-30+'px');
    host.appendChild(b);
    setTimeout(()=>b.remove(),950);
  }
}
function update(){
  const v=+range.value;
  paintTrack(v);
  if(won) return;
  needle.style.transform=`rotate(${-90+v*1.8}deg)`;
  if(v===0){ showCat('idle'); reaction.textContent=CONFIG.question; percent.textContent='0%'; }
  else if(v<40){ showCat('cry'); reaction.textContent=CONFIG.reactions.low; percent.textContent=v+'%'; }
  else if(v<70){ showCat('meh'); reaction.textContent=CONFIG.reactions.mid; percent.textContent=v+'%'; }
  else if(v<100){ showCat('yay'); reaction.textContent=CONFIG.reactions.high; percent.textContent=v+'%'; }
  else{ // 100 → win
    won=true;
    showCat('yay');
    reaction.textContent=CONFIG.reactions.win;
    percent.textContent='1000%';
    needle.classList.add('win');
    range.disabled=true;
    burst();
    setTimeout(()=>{ percent.classList.add('hide'); meterNext.classList.add('show'); },900);
  }
}
range.addEventListener('input',update);
paintTrack(0);
meterNext.addEventListener('click',()=>goTo('screen-passed'));

/* ============================================================
   SCREEN 2 — gifts
   ============================================================ */
$$('[data-gift]').forEach(g=>{
  g.addEventListener('click',()=>{
    if(g.dataset.done)return; g.dataset.done=1;
    g.classList.remove('bounce');
    g.classList.add('opening');
    setTimeout(()=>g.classList.add('open'),380);
    setTimeout(()=>goTo('screen-bouquet'),1000);
  });
});

/* ============================================================
   SCREEN 3 — bouquet notes
   ============================================================ */
$('#bouquetTitle').textContent=CONFIG.bouquetTitle;
const L=$('#notesLeft'),R=$('#notesRight');
CONFIG.bouquetNotes.forEach((t,i)=>{
  const n=document.createElement('div');
  n.className='note';n.textContent=t;
  (i%2===0?L:R).appendChild(n);
});
let notesShown=false;
function revealNotes(){
  if(notesShown)return; notesShown=true;
  $$('.note').forEach((n,i)=>setTimeout(()=>n.classList.add('in'),300+i*350));
}

/* ============================================================
   SCREEN 4 — music player
   ============================================================ */
$('#songTitle').textContent=CONFIG.song.title;
$('#songArtist').textContent=CONFIG.song.artist;
const audio=$('#loveSong'), playBtn=$('#btnPlay'),
      iconPlay='<path d="M8 5v14l11-7z"/>',
      iconPause='<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>',
      bar=$('#progressBar');
let playing=false, simT=0, simTimer=null, hasAudio=true;
audio.addEventListener('error',()=>hasAudio=false);
function setIcon(){ $('#iconPlay').innerHTML = playing?iconPause:iconPlay; }
function tickSim(){
  simT=(simT+0.25)%CONFIG.song.fallbackDuration;
  bar.style.width=(simT/CONFIG.song.fallbackDuration*100)+'%';
}
playBtn.addEventListener('click',()=>{
  playing=!playing; setIcon();
  if(hasAudio && audio.readyState!==0 || hasAudio){
    if(playing){ audio.play().catch(()=>{hasAudio=false; simTimer=setInterval(tickSim,250);}); }
    else{ audio.pause(); clearInterval(simTimer); }
  }
  if(!hasAudio){
    if(playing) simTimer=setInterval(tickSim,250);
    else clearInterval(simTimer);
  }
});
audio.addEventListener('timeupdate',()=>{
  if(audio.duration) bar.style.width=(audio.currentTime/audio.duration*100)+'%';
});
$('#btnPrev').addEventListener('click',()=>{ if(hasAudio)audio.currentTime=0; simT=0; bar.style.width='0%'; });
$('#btnNextT').addEventListener('click',()=>{ if(hasAudio)audio.currentTime=0; simT=0; bar.style.width='0%'; });

/* ============================================================
   SCREEN 5 — typewriter letter
   ============================================================ */
$('#letterTitle').textContent=CONFIG.letterTitle;
const letterText=$('#letterText'), signOff=$('#signOff'), letterBtn=$('#letterBtn');
let typed=false, typeTimer=null;
function startLetter(){
  if(typed)return; typed=true;
  const full=CONFIG.letterParagraphs.join('\n\n');
  let i=0;
  letterText.innerHTML='<span class="caret"></span>';
  function step(){
    if(i<=full.length){
      letterText.innerHTML=full.slice(0,i).replace(/\n/g,'\n')+'<span class="caret"></span>';
      letterText.parentElement.scrollTop=letterText.parentElement.scrollHeight;
      i++;
      typeTimer=setTimeout(step, full[i-1]==='\n'?260:26);
    }else{
      letterText.innerHTML=full;
      signOff.textContent=CONFIG.signOff;
      signOff.classList.add('in');
      letterBtn.innerHTML='Replay&nbsp;♥';
    }
  }
  step();
  // click to skip typing
  letterText.parentElement.addEventListener('click',()=>{
    clearTimeout(typeTimer);
    letterText.innerHTML=full;
    signOff.textContent=CONFIG.signOff;
    signOff.classList.add('in');
    letterBtn.innerHTML='Replay&nbsp;♥';
  },{once:true});
}
letterBtn.addEventListener('click',()=>{
  if(letterBtn.textContent.includes('Replay')){
    // full reset
    typed=false; won=false; notesShown=false;
    range.disabled=false; range.value=0; paintTrack(0);
    percent.classList.remove('hide'); percent.textContent='0%';
    meterNext.classList.remove('show');
    needle.classList.remove('win'); needle.style.transform='rotate(-90deg)';
    reaction.textContent=CONFIG.question; showCat('idle');
    $$('.note').forEach(n=>n.classList.remove('in'));
    $$('[data-gift]').forEach(g=>{delete g.dataset.done; g.classList.remove('open','opening'); g.classList.add('bounce');});
    letterBtn.innerHTML='Next&nbsp;&rarr;'; signOff.classList.remove('in');
    letterText.innerHTML='<span class="caret"></span>';
    goTo('screen-meter');
  }
});
</script>
</body>
</html>
